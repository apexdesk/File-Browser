name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev
      - run: cargo test --release --lib

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-aarch64, os: windows-latest,  target: aarch64-pc-windows-msvc }
          - { name: macos,          os: macos-latest,     target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.name == 'macos' && ',x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libasound2-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --bin filebrowser --target ${{ matrix.target }}
          mkdir -p stage out
          cp target/${{ matrix.target }}/release/filebrowser stage/
          cp assets/filebrowser-rs.desktop LICENSE stage/
          cp assets/icon-256.png stage/filebrowser-rs.png
          tar -C stage -czf out/filebrowser-${{ matrix.name }}.tar.gz .

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --bin filebrowser --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/filebrowser.exe out/filebrowser-${{ matrix.name }}.exe

      - name: Build (macOS universal app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release --bin filebrowser --target aarch64-apple-darwin
          cargo build --release --bin filebrowser --target x86_64-apple-darwin
          APP="File Browser.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          lipo -create -output "$APP/Contents/MacOS/filebrowser" \
            target/aarch64-apple-darwin/release/filebrowser target/x86_64-apple-darwin/release/filebrowser
          mkdir icon.iconset
          sips -z 128 128 assets/icon-512.png --out icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon-512.png --out icon.iconset/icon_256x256.png
          cp assets/icon-512.png icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>File Browser</string>
            <key>CFBundleDisplayName</key><string>File Browser</string>
            <key>CFBundleIdentifier</key><string>io.github.apexdesk.filebrowser</string>
            <key>CFBundleExecutable</key><string>filebrowser</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>Folder</string>
              <key>CFBundleTypeRole</key><string>Viewer</string>
              <key>LSHandlerRank</key><string>Alternate</string>
              <key>LSItemContentTypes</key><array><string>public.folder</string></array>
            </dict></array>
            <key>CFBundleShortVersionString</key><string>$(cargo pkgid | sed 's/.*[#@]//')</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" out/filebrowser-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    name: Build Android (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64,  abi: arm64-v8a,   target: aarch64-linux-android,    apk: FileBrowser.apk }
          - { name: armv7,  abi: armeabi-v7a, target: armv7-linux-androideabi,  apk: FileBrowser-armv7.apk }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.name }}
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" "ndk;27.3.13750724"
          echo "NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KS_PASS=${{ secrets.ANDROID_KS_PASS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KS_ALIAS=${{ secrets.ANDROID_KS_ALIAS }}" >> "$GITHUB_ENV"
          fi
      - run: ./android/build-apk.sh ${{ matrix.abi }}
      - run: mkdir -p out && cp target-android/${{ matrix.apk }} out/filebrowser-android-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-android-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  flatpak:
    name: Build Flatpak bundle (x86_64)
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: filebrowser-linux-x86_64
          path: in
      - name: Install Flatpak and runtime
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Bundle
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          flatpak/build.sh in/filebrowser-linux-x86_64.tar.gz "$ver" out/filebrowser-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-flatpak-x86_64
          path: out/*
          if-no-files-found: error

  linux-packages:
    name: Linux packages (deb, rpm, Arch)
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: filebrowser-linux-*
          path: in
      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tgz nfpm
          sudo mv nfpm /usr/local/bin/
      - name: Build packages
        run: |
          export VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          for pair in x86_64:amd64 aarch64:arm64; do
            name=${pair%%:*}; export ARCH=${pair##*:}
            mkdir -p "bin-$name"
            tar -xzf "in/filebrowser-linux-$name/filebrowser-linux-$name.tar.gz" -C "bin-$name" ./filebrowser
            export BIN="$PWD/bin-$name/filebrowser"
            envsubst '${BIN}' < packaging/nfpm.yaml > "nfpm-$name.yaml"
            for fmt in deb rpm archlinux; do
              nfpm package -f "nfpm-$name.yaml" -p $fmt -t out/
            done
          done
          cd out
          for f in *; do
            case "$f" in
              filebrowser-*) ;;
              *) mv "$f" "filebrowser-$f" ;;
            esac
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-linux-packages
          path: out/*
          if-no-files-found: error

  windows-packages:
    name: Windows packages (portable, MSI, MSIX)
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: filebrowser-windows-*
          path: in
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build packages
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msixVer = "$ver.0"
          New-Item -ItemType Directory -Force out | Out-Null
          # Certificado autofirmado para el MSIX (Publisher debe coincidir con el manifiesto)
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=apexdesk" -KeyUsage DigitalSignature -FriendlyName "File Browser" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "filebrowser" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath out/filebrowser-msix.cer | Out-Null
          $makeappx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          foreach ($a in @(@("x86_64","x64"), @("aarch64","arm64"))) {
            $name = $a[0]; $arch = $a[1]
            $exe = (Resolve-Path "in/filebrowser-windows-$name/filebrowser-windows-$name.exe").Path
            # Portable
            $dir = "portable-$name"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item $exe "$dir/filebrowser.exe"
            Copy-Item LICENSE "$dir/LICENSE.txt"
            Copy-Item windows/README-portable.txt "$dir/README.txt"
            Set-Content -Path "$dir/portable.txt" -Value "Delete this file to store settings in %APPDATA% instead of the data folder."
            Compress-Archive -Path "$dir/*" -DestinationPath "out/filebrowser-windows-$name-portable.zip"
            # MSI
            wix build -arch $arch -d Version=$ver -d Exe=$exe -d Root=$($PWD.Path) -d UpgradeCode=6b675764-a475-49f6-8b36-e53ab0b5eead windows/filebrowser.wxs -o "out/filebrowser-windows-$name.msi"
            if ($LASTEXITCODE -ne 0) { throw "wix failed" }
            # MSIX
            $pk = "msix-$name"
            New-Item -ItemType Directory -Force "$pk/Assets" | Out-Null
            Copy-Item windows/Assets/*.png "$pk/Assets/"
            Copy-Item $exe "$pk/filebrowser.exe"
            (Get-Content windows/AppxManifest.xml -Raw).Replace("@VERSION@", $msixVer).Replace("@ARCH@", $arch) | Set-Content "$pk/AppxManifest.xml" -Encoding utf8
            & $makeappx pack /d $pk /p "out/filebrowser-windows-$name.msix" /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
            & $signtool sign /fd SHA256 /f sign.pfx /p filebrowser "out/filebrowser-windows-$name.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: filebrowser-windows-packages
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, android, flatpak, linux-packages, windows-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum filebrowser-* > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "File Browser ${tag}" --generate-notes
          fi
