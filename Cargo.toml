[package]
name = "filebrowser"
version = "0.8.3"
edition = "2024"
license = "PolyForm-Strict-1.0.0"

[lib]
name = "filebrowser"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "filebrowser"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.36.2", default-features = false }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp", "bmp"] }
jpeg-decoder = "0.3.2"
md-5 = "0.11.0"
portable-pty = "0.9.0"
resvg = { version = "0.48.1", default-features = false }
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["util", "compress"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "aac", "isomp4", "alac", "pcm"] }
tar = "0.4.46"
vt100 = "0.16.2"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 2

[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15.3"
trash = "5.2.9"
# RAR sólo se extrae/lista (la biblioteca C++ de RARLAB no compila con el NDK de Android)
unrar = "0.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Arrastre de archivos hacia otras aplicaciones (Wayland y X11)
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["all"] }
objc2-app-kit = { version = "0.2", features = ["all"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
log = "0.4"
jni = "0.21"

# egui-winit parcheado: Ctrl+V debe llegar a la app aunque el portapapeles no tenga texto
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
