[package]
name = "filebrowser"
version = "0.9.2"
edition = "2024"
license = "PolyForm-Strict-1.0.0"

[workspace]
members = ["server"]
# `cargo build --release` sigue compilando solo el gestor; el servidor: `-p filebrowser-server`
default-members = ["."]

[lib]
name = "filebrowser"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "filebrowser"
path = "src/main.rs"

[dependencies]
apex-view = { path = "apex-view" }
dirs = "7.0.0"
web-time = "1.1"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36.2", default-features = false }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff", "ico"] }
jpeg-decoder = "0.3.2"
md-5 = "0.11.0"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
resvg = { version = "0.48.1", default-features = false }
skrifa = "0.44"
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["util", "compress", "aes256"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "aac", "isomp4", "alac", "pcm"] }
tar = "0.4.46"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
vt100 = "0.16.2"
zip = { version = "9.0.1", default-features = false, features = ["deflate", "aes-crypto"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

# apex-view y sus bibliotecas se compilan por tamaño (según su README): ~1 MB menos en el binario
[profile.release.package]
filebrowser-server.opt-level = "z"
apex-view.opt-level = "z"
vello_cpu.opt-level = "s"
vello_common.opt-level = "s"
fearless_simd.opt-level = "s"
skrifa.opt-level = "s"
read-fonts.opt-level = "s"
font-types.opt-level = "s"
kurbo.opt-level = "s"
peniko.opt-level = "s"
color.opt-level = "s"
encoding_rs.opt-level = "s"
zune-jpeg.opt-level = "s"
zune-core.opt-level = "s"

# perfil de la versión web: tamaño antes que velocidad (se descarga entera)
[profile.web]
inherits = "release"
opt-level = "s"
lto = true

# para depurar la versión web: compila deprisa y conserva los nombres de las funciones
[profile.webdev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
panic = "unwind"

[profile.dev]
opt-level = 2

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
portable-pty = "0.9.0"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
cpal = "0.15.3"
trash = "5.2.9"
# RAR sólo se extrae/lista (la biblioteca C++ de RARLAB no compila con el NDK de Android)
unrar = "0.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Arrastre de archivos hacia otras aplicaciones (Wayland y X11)
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"] }
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["all"] }
objc2-app-kit = { version = "0.2", features = ["all"] }
fsevent = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
log = "0.4"
jni = "0.21"

# egui-winit parcheado: Ctrl+V debe llegar a la app aunque el portapapeles no tenga texto
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
# presupuesto de operadores en glifos CFF (necesario para apex-view)
read-fonts = { path = "apex-view/vendor/read-fonts" }

# Versión web (WebAssembly): el cliente es la propia aplicación compilada para el navegador
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlInputElement", "FileList", "File", "Blob", "Location", "XmlHttpRequest", "Storage", "console"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
