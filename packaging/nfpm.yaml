# Paquetes de Linux (deb, rpm y Arch) con nfpm. Variables: VERSION y ARCH (amd64|arm64) las expande nfpm; BIN (ruta al binario) se sustituye antes con envsubst '${BIN}'.
name: filebrowser
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: apexdesk <50219414+apexdesk@users.noreply.github.com>
description: |
  Fast, lightweight, cross-platform file manager.
  Preview documents, 3D models and audio, instant search, archives as folders, SFTP/SMB/WebDAV.
homepage: https://github.com/apexdesk/File-Browser
license: PolyForm-Strict-1.0.0
contents:
  - src: ${BIN}
    dst: /usr/bin/filebrowser-rs
    file_info:
      mode: 0755
  - src: /usr/bin/filebrowser-rs
    dst: /usr/bin/filebrowser
    type: symlink
  - src: assets/filebrowser-rs.desktop
    dst: /usr/share/applications/filebrowser-rs.desktop
  - src: assets/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/filebrowser-rs.png
  - src: assets/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/filebrowser-rs.svg
  - src: LICENSE
    dst: /usr/share/doc/filebrowser/LICENSE
overrides:
  deb:
    depends: [libc6, libstdc++6, libgcc-s1, "libasound2t64 | libasound2"]
    recommends: [libgl1, libxkbcommon0]
  rpm:
    depends: [libstdc++, alsa-lib]
    recommends: [mesa-libGL]
  archlinux:
    depends: [gcc-libs, alsa-lib]
