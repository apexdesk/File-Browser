[package]
name = "filebrowser-web"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Strict-1.0.0"
description = "Cliente web (egui compilado a WebAssembly) del File Browser; habla con filebrowser-server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui = { version = "0.36.2", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ehttp = { version = "0.7", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
